services:
  db:
    image: postgres:15-alpine
    container_name: carbon_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_monitor
      POSTGRES_USER: carbon_user
      POSTGRES_PASSWORD: carbon_pass
    ports:
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon_user -d carbon_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: carbon_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: carbon_user
      DB_PASSWORD: carbon_pass
      DB_NAME: carbon_monitor
      DB_PORT: 5432
      JWT_SECRET: carbon_secret_key_2026
      PORT: 5000

  frontend:
    build: ./frontend
    container_name: carbon_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000

volumes:
  db_data:
