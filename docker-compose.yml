version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: carbon_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: carbon_monitor
      MYSQL_USER: carbon_user
      MYSQL_PASSWORD: carbon_pass
    ports:
      - "3307:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: carbon_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: carbon_user
      DB_PASSWORD: carbon_pass
      DB_NAME: carbon_monitor
      DB_PORT: 3306
      JWT_SECRET: carbon_secret_key_2026
      PORT: 5000

  frontend:
    build: ./frontend
    container_name: carbon_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000

volumes:
  db_data:
